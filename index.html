<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Citizen Team Up - LFG Platform</title>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* CSS Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5em;
            color: #00d4ff;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .kofi-button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff5e62 0%, #ff9966 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 94, 98, 0.3);
        }

        .kofi-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 94, 98, 0.5);
        }

        /* Form Section */
        .create-group-section {
            background: rgba(0, 212, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .create-group-section h2 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #00d4ff;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        /* LFG Section */
        .lfg-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .lfg-section h2 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        /* Group Cards */
        .groups-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .group-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .group-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
        }

        .group-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
            border-color: rgba(0, 212, 255, 0.5);
        }

        .group-title {
            color: #00d4ff;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .group-activity {
            display: inline-block;
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            margin-bottom: 10px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .group-description {
            color: #b0b0b0;
            margin: 15px 0;
            line-height: 1.5;
        }

        .group-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-count {
            color: #00d4ff;
            font-weight: bold;
            font-size: 1.1em;
        }

        .creator {
            color: #888;
            font-size: 0.9em;
        }

        .join-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .join-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.5);
        }

        .join-button:active {
            transform: translateY(0);
        }

        .no-groups {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.1em;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 40px;
            color: #00d4ff;
            font-size: 1.1em;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .create-group-section,
            .lfg-section {
                padding: 20px;
            }

            .groups-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.5em;
            }

            .create-group-section h2,
            .lfg-section h2 {
                font-size: 1.4em;
            }
        }

        /* Option styling for better visibility */
        select option {
            background: #1a1f3a;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🚀 Star Citizen Team Up</h1>
            <p>Find your crew for any mission across the verse</p>
            <a href="https://ko-fi.com/" target="_blank" class="kofi-button">☕ Support on Ko-Fi</a>
        </header>

        <!-- Create Group Section -->
        <section class="create-group-section">
            <h2>Create a New Group</h2>
            <form id="createGroupForm">
                <div class="form-group">
                    <label for="creatorHandle">Your Star Citizen Handle *</label>
                    <input type="text" id="creatorHandle" name="creatorHandle" required placeholder="Enter your handle">
                </div>

                <div class="form-group">
                    <label for="activityType">Activity Type *</label>
                    <select id="activityType" name="activityType" required>
                        <option value="">Select an activity</option>
                        <option value="Bounty Hunting">Bounty Hunting</option>
                        <option value="Mining">Mining</option>
                        <option value="Salvaging">Salvaging</option>
                        <option value="Trading">Trading</option>
                        <option value="Mercenary">Mercenary</option>
                        <option value="Investigations">Investigations</option>
                        <option value="Search and Rescue">Search and Rescue</option>
                        <option value="Piracy">Piracy</option>
                        <option value="PVP">PVP</option>
                        <option value="Exploration">Exploration</option>
                        <option value="Xenothreat">Xenothreat</option>
                        <option value="Nine Tails Lockdown">Nine Tails Lockdown</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="groupTitle">Group Title *</label>
                    <input type="text" id="groupTitle" name="groupTitle" required placeholder="e.g., Need 3 for ERT Bounties">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" placeholder="Describe your mission, requirements, or preferences..."></textarea>
                </div>

                <div class="form-group">
                    <label for="maxPlayers">Max Players *</label>
                    <input type="number" id="maxPlayers" name="maxPlayers" min="2" max="20" value="4" required>
                </div>

                <button type="submit">Create Group</button>
            </form>
        </section>

        <!-- LFG Section -->
        <section class="lfg-section">
            <h2>Looking for Group (LFG)</h2>
            <div id="groupsContainer" class="groups-container">
                <div class="loading">Loading groups...</div>
            </div>
        </section>
    </div>

    <script>
        // ============================================
        // SUPABASE CONFIGURATION
        // ============================================
        // TODO: Replace these with your actual Supabase credentials
        const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';

        // Initialize Supabase client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================
        // CORE FUNCTIONS
        // ============================================

        /**
         * Loads and displays all open groups with member counts
         */
        async function loadGroups() {
            try {
                // First check for expired groups
                await checkExpiredGroups();

                // Fetch all open groups
                const { data: groups, error: groupsError } = await supabase
                    .from('starcitizen_teamup_groups')
                    .select('*')
                    .eq('status', 'open')
                    .order('created_at', { ascending: false });

                if (groupsError) throw groupsError;

                const groupsContainer = document.getElementById('groupsContainer');

                // If no groups found
                if (!groups || groups.length === 0) {
                    groupsContainer.innerHTML = '<div class="no-groups">No active groups. Be the first to create one! 🚀</div>';
                    return;
                }

                // Fetch member counts for all groups
                const groupsWithCounts = await Promise.all(groups.map(async (group) => {
                    const { count, error: countError } = await supabase
                        .from('starcitizen_teamup_members')
                        .select('*', { count: 'exact', head: true })
                        .eq('group_id', group.id);

                    if (countError) {
                        console.error('Error fetching member count:', countError);
                        return { ...group, memberCount: 0 };
                    }

                    return { ...group, memberCount: count || 0 };
                }));

                // Render groups
                groupsContainer.innerHTML = groupsWithCounts.map(group => `
                    <div class="group-card">
                        <div class="group-title">${escapeHtml(group.title)}</div>
                        <span class="group-activity">${escapeHtml(group.activity_type)}</span>
                        ${group.description ? `<div class="group-description">${escapeHtml(group.description)}</div>` : ''}
                        <div class="group-meta">
                            <span class="player-count">👥 ${group.memberCount}/${group.max_players}</span>
                            <span class="creator">by ${escapeHtml(group.creator_handle)}</span>
                        </div>
                        <button class="join-button" onclick="handleJoinGroup('${group.id}')">Join Group</button>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading groups:', error);
                document.getElementById('groupsContainer').innerHTML =
                    '<div class="no-groups">Error loading groups. Please refresh the page.</div>';
            }
        }

        /**
         * Creates a new group and adds the creator as the first member
         */
        async function createGroup(event) {
            event.preventDefault();

            try {
                const form = event.target;
                const formData = new FormData(form);

                // Calculate expiration time (10 minutes from now)
                const expiresAt = new Date();
                expiresAt.setMinutes(expiresAt.getMinutes() + 10);

                // Prepare group data
                const groupData = {
                    creator_handle: formData.get('creatorHandle'),
                    activity_type: formData.get('activityType'),
                    title: formData.get('groupTitle'),
                    description: formData.get('description') || null,
                    max_players: parseInt(formData.get('maxPlayers')),
                    status: 'open',
                    expires_at: expiresAt.toISOString()
                };

                // Insert group
                const { data: newGroup, error: groupError } = await supabase
                    .from('starcitizen_teamup_groups')
                    .insert([groupData])
                    .select()
                    .single();

                if (groupError) throw groupError;

                // Add creator as first member
                const { error: memberError } = await supabase
                    .from('starcitizen_teamup_members')
                    .insert([{
                        group_id: newGroup.id,
                        player_handle: groupData.creator_handle
                    }]);

                if (memberError) throw memberError;

                // Reset form and reload groups
                form.reset();
                alert('Group created successfully! 🚀');
                await loadGroups();

            } catch (error) {
                console.error('Error creating group:', error);
                alert('Error creating group. Please try again.');
            }
        }

        /**
         * Handles joining a group
         * Prompts for player handle and adds them to the group
         */
        async function handleJoinGroup(groupId) {
            const playerHandle = prompt('Enter your Star Citizen handle:');

            if (!playerHandle || playerHandle.trim() === '') {
                alert('Please enter a valid handle.');
                return;
            }

            await joinGroup(groupId, playerHandle.trim());
        }

        /**
         * Adds a player to a group and updates status if full
         */
        async function joinGroup(groupId, playerHandle) {
            try {
                // Check if player is already in the group
                const { data: existingMember, error: checkError } = await supabase
                    .from('starcitizen_teamup_members')
                    .select('*')
                    .eq('group_id', groupId)
                    .eq('player_handle', playerHandle)
                    .single();

                if (existingMember) {
                    alert('You are already in this group!');
                    return;
                }

                // Insert new member
                const { error: memberError } = await supabase
                    .from('starcitizen_teamup_members')
                    .insert([{
                        group_id: groupId,
                        player_handle: playerHandle
                    }]);

                if (memberError) throw memberError;

                // Get current member count and max players
                const { count: memberCount, error: countError } = await supabase
                    .from('starcitizen_teamup_members')
                    .select('*', { count: 'exact', head: true })
                    .eq('group_id', groupId);

                if (countError) throw countError;

                const { data: group, error: groupError } = await supabase
                    .from('starcitizen_teamup_groups')
                    .select('max_players')
                    .eq('id', groupId)
                    .single();

                if (groupError) throw groupError;

                // If group is full, update status
                if (memberCount >= group.max_players) {
                    const newExpiresAt = new Date();
                    newExpiresAt.setMinutes(newExpiresAt.getMinutes() + 10);

                    const { error: updateError } = await supabase
                        .from('starcitizen_teamup_groups')
                        .update({
                            status: 'full',
                            expires_at: newExpiresAt.toISOString()
                        })
                        .eq('id', groupId);

                    if (updateError) throw updateError;

                    alert('Successfully joined! Group is now full. 🎉');
                } else {
                    alert('Successfully joined the group! 🚀');
                }

                // Reload groups
                await loadGroups();

            } catch (error) {
                console.error('Error joining group:', error);
                alert('Error joining group. Please try again.');
            }
        }

        /**
         * Checks for expired full groups and updates their status to closed
         */
        async function checkExpiredGroups() {
            try {
                const now = new Date().toISOString();

                // Find expired full groups
                const { data: expiredGroups, error: fetchError } = await supabase
                    .from('starcitizen_teamup_groups')
                    .select('id')
                    .eq('status', 'full')
                    .lt('expires_at', now);

                if (fetchError) throw fetchError;

                if (expiredGroups && expiredGroups.length > 0) {
                    // Update expired groups to closed
                    const { error: updateError } = await supabase
                        .from('starcitizen_teamup_groups')
                        .update({ status: 'closed' })
                        .eq('status', 'full')
                        .lt('expires_at', now);

                    if (updateError) throw updateError;

                    console.log(`Closed ${expiredGroups.length} expired group(s)`);
                }

            } catch (error) {
                console.error('Error checking expired groups:', error);
            }
        }

        /**
         * Escapes HTML to prevent XSS attacks
         */
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text ? text.replace(/[&<>"']/g, m => map[m]) : '';
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        // Load groups on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadGroups();

            // Set up form submission
            document.getElementById('createGroupForm').addEventListener('submit', createGroup);

            // Check for expired groups every 60 seconds
            setInterval(checkExpiredGroups, 60000);
        });
    </script>
</body>
</html>
